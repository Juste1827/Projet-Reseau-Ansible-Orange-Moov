---
# WHY: tout ce qui est SPÉCIFIQUE Cisco vit ici, pas dans le playbook.
# Le playbook dit "quoi faire". Les group_vars disent "comment ce vendor parle".

vendor: cisco
os_family: ios

# Plugin de connexion Ansible dédié au CLI réseau (SSH + paging + enable)
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.ios.ios

# WHY become enable : sur IOS, beaucoup de commandes de conf exigent le mode privilégié (#)
ansible_become: true
ansible_become_method: enable

# User de management — le MOT DE PASSE est dans Vault, jamais ici
ansible_user: ansible

# Port SSH (22 lab ; en prod souvent un port mgmt out-of-band)
ansible_port: 22
