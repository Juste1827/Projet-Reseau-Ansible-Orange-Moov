---
# WHY: l'inventaire EST la source de vérité de la topologie.
# En télécom, on ne "tape" pas 50 hostnames à la main : on décrit le réseau, Ansible itère.
#
# 192.0.2.0/24 = plage de DOCUMENTATION (RFC 5737). Pas d'IP réelle, donc pas de risque
# de pousser une config vers un vrai routeur Orange/Moov par erreur.

all:
  children:
    # WHY un groupe par constructeur : les CLI et les modules Ansible ne sont pas les mêmes.
    # Un playbook "hosts: cisco" ne touchera jamais un Huawei (isolation = sûreté).
    cisco:
      hosts:
        R1-PE-ABJ:                    # hostname logique (aussi utilisé comme inventory_hostname)
          ansible_host: 192.0.2.11    # IP de management (ici fictive, lab)

    huawei:
      hosts:
        R2-PE-ABJ:
          ansible_host: 192.0.2.12
