# WHY: ansible.cfg = comportement par défaut du control node.
# Sans ce fichier, chaque collègue lancerait Ansible avec des options différentes = plus de reproductibilité.

[defaults]
# Inventaire unique : la topologie lab vit ici, pas en ligne de commande
# WHY deux fichiers : le lab PE (cisco/huawei) et la campagne 50 antennes.
# Les plays ciblent un groupe : 01 ne touche PAS antennes_4g, 04 ne touche PAS R1/R2.
inventory = inventory/hosts.yml,inventory/antennes.yml

# WHY : nos filtres CIDR (cidr_to_address / cidr_to_netmask) vivent dans filter_plugins/
filter_plugins = filter_plugins

# Les rôles sont dans ce dépôt (pas dans un chemin magique du user)
roles_path = roles

# WHY false : le module setup Linux (gather_facts) ne s'applique pas à un routeur.
# On active les facts réseau explicitement dans un playbook dédié si besoin.
gathering = explicit

# WHY false en lab seulement : sans ça, le premier SSH demande de valider le fingerprint (bloquant en CI).
# EN PRODUCTION chez un opérateur : TOUJOURS vérifier les host keys (True) pour éviter un MITM.
host_key_checking = False

# Fichiers .retry = bruit Git. On s'en passe.
retry_files_enabled = False

# Sortie YAML = lisible pour apprendre (et pour coller un extrait dans un rapport)
stdout_callback = yaml

# Windows/WSL/Docker : ne pas se battre avec le python interpréteur distant (nous on est control node)
interpreter_python = auto_silent

# Inventaire YAML (plugin moderne, pas l'ancien format INI)
[inventory]
enable_plugins = yaml, auto

# WHY : sur Cisco, "become" = passer en mode enable (#), PAS sudo Linux.
[privilege_escalation]
become = False
