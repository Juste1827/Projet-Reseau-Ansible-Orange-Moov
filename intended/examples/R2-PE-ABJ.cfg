# WHY : même intention métier que Cisco, AUTRE dialecte CLI (sysname, Vlanif, undo shutdown).
# C'est le cœur du multi-constructeur : une source de vérité, N templates.
#
sysname R2-PE-ABJ
#
vlan 10
 description DATA
#
vlan 20
 description VOICE
#
interface GigabitEthernet0/0/0
 description P2P-to-R1-Cisco
 ip address 10.0.0.2 255.255.255.252
 undo shutdown
#
interface Vlanif10
 description SVI-DATA
 ip address 10.10.10.2 255.255.255.0
 undo shutdown
#
interface Vlanif20
 description SVI-VOICE
 ip address 10.20.20.2 255.255.255.0
 undo shutdown
#
return
