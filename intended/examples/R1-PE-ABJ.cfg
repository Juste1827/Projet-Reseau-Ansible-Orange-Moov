! WHY : état DÉSIRÉ Cisco, projeté depuis le YAML (hostname, VLAN, IP).
! Idempotence : syntaxe identique au show running-config (commandes COMPLÈTES, pas d'abréviations).
! Piège entretien : "int g0/0" ou "no shut" => Ansible croit que ça a changé à CHAQUE run.
!
hostname R1-PE-ABJ
!
vlan 10
 name DATA
!
vlan 20
 name VOICE
!
interface GigabitEthernet0/0
 description P2P-to-R2-Huawei
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
interface Vlan10
 description SVI-DATA
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description SVI-VOICE
 ip address 10.20.20.1 255.255.255.0
 no shutdown
!
end
